# Shared proxy settings for every location in deploy/nginx.conf.template;
# installed as /etc/nginx/faangjobs-proxy.conf by deploy/install.sh.
proxy_pass http://127.0.0.1:8080;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# The app builds candidate-facing links from this (crm_gmail.go schemeOf).
proxy_set_header X-Forwarded-Proto $scheme;
# Candidate scrapes run auto-apply inside the request (can take minutes).
proxy_read_timeout 600s;
proxy_send_timeout 600s;
